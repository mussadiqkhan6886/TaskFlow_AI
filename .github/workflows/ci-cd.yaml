name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ====================================================================
  # Job 1: Test & Typecheck Backend
  # ====================================================================
  test-backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache MongoDB In-Memory Binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Typecheck / Compile TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          ACCESS_TOKEN: "${{ secrets.ACCESS_TOKEN }}"
          REFRESH_TOKEN: "${{ secrets.REFRESH_TOKEN }}"
          PORT: 4000
        run: npm run test:run

  # ====================================================================
  # Job 2: Test & Build Frontend
  # ====================================================================
  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:4000
          INTERNAL_API_URL: http://backend:4000
          ACCESS_TOKEN: "${{ secrets.ACCESS_TOKEN }}"
        run: npm run build

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test:run

  # ====================================================================
  # Job 3: Docker Compose Build & E2E Testing
  # Builds Docker images for backend & frontend, runs them, and tests with Playwright
  # ====================================================================
  docker-e2e:
    name: Docker Build & E2E Tests
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Create Environment Files for Docker
        run: |
          cat << 'EOF' > frontend/.env
          NEXT_PUBLIC_BASE_URL=http://localhost:4000
          ACCESS_TOKEN="${{ secrets.ACCESS_TOKEN }}"
          INTERNAL_API_URL=http://backend:4000
          EOF

          cat << 'EOF' > backend/.env
          MONGODB_URI="${{ secrets.MONGODB_URI }}"
          NODE_ENV=production
          PORT=4000
          ACCESS_TOKEN="${{ secrets.ACCESS_TOKEN }}"
          REFRESH_TOKEN="${{ secrets.REFRESH_TOKEN }}"
          REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
          REDIS_HOST="${{ secrets.REDIS_HOST }}"
          REDIS_PORT="${{ secrets.REDIS_PORT }}"
          GEMINI_AI_API_KEY="${{ secrets.GEMINI_AI_API_KEY }}"
          FRONTEND_URL=http://localhost:3000
          BACKEND_URL=http://localhost:4000
          EOF

      - name: Build and Start Containers with Docker Compose
        run: |
          docker compose up --build -d

      - name: Wait for Backend and Frontend Readiness
        run: |
          echo "Waiting for Backend to report healthy..."
          timeout 120 bash -c 'until curl -sf http://localhost:4000/health; do sleep 2; done'
          echo "Backend is ready!"

          echo "Waiting for Frontend to respond..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Frontend is ready!"

      - name: Install E2E Dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests Against Docker
        working-directory: ./e2e
        run: npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose logs backend
          echo "=== Frontend Logs ==="
          docker compose logs frontend

      - name: Teardown Docker Compose Containers
        if: always()
        run: |
          docker compose down -v
  
  
  build-and-push-ecr:
    name: Build, Push and Deploy to ECS
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, docker-e2e]

    # Deploy only after tests pass, and only from main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-north-1
          role-to-assume: ${{ secrets.AWS_IAM }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 1. Build and push both images using this commit SHA
      # --------------------------------------------------
      - name: Build and Push Backend Image
        id: backend-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          docker build \
            -t "$REGISTRY/backend:$IMAGE_TAG" \
            ./backend

          docker push "$REGISTRY/backend:$IMAGE_TAG"
          echo "image=$REGISTRY/backend:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and Push Frontend Image
        id: frontend-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          NEXT_PUBLIC_BASE_URL: http://taskflow-alb-862843803.eu-north-1.elb.amazonaws.com
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" \
            -t "$REGISTRY/frontend:$IMAGE_TAG" \
            ./frontend

          docker push "$REGISTRY/frontend:$IMAGE_TAG"
          echo "image=$REGISTRY/frontend:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          
      # --------------------------------------------------
      # 2. Download the CURRENT backend task definition
      #    and prepare it for a new revision
      # --------------------------------------------------
      - name: Download Backend Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition taskflow-backend-task \
            --query taskDefinition \
            --output json > backend-task-definition-raw.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt,
            .ephemeralStorage
          )' backend-task-definition-raw.json \
            > backend-task-definition.json

      - name: Insert New Backend Image
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: backend
          image: ${{ steps.backend-image.outputs.image }}

      - name: Deploy Backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          cluster: taskflow-cluster
          service: taskflow-backend-service
          wait-for-service-stability: true

      # --------------------------------------------------
      # 3. Download the CURRENT frontend task definition
      # --------------------------------------------------
      - name: Download Frontend Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition taskflow-frontend-task \
            --query taskDefinition \
            --output json > frontend-task-definition-raw.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt,
            .ephemeralStorage
          )' frontend-task-definition-raw.json \
            > frontend-task-definition.json

      - name: Insert New Frontend Image
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: frontend
          image: ${{ steps.frontend-image.outputs.image }}

      - name: Deploy Frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          cluster: taskflow-cluster
          service: taskflow-frontend-service
          wait-for-service-stability: true
