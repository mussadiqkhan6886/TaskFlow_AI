
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:4000}

    restart: unless-stopped
    init: true

    env_file:
    - ./frontend/.env

    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: "0.0.0.0"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

    ports:
      - "4000:4000"

    networks:
      - app-network

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  app-network:
    driver: bridge
